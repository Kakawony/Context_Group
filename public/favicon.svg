<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="cg-core" cx="37%" cy="33%" r="78%">
      <stop offset="0%" stop-color="#ffd6e6"/>
      <stop offset="30%" stop-color="#f9064f"/>
      <stop offset="100%" stop-color="#9355f6"/>
    </radialGradient>
    <radialGradient id="cg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f9064f" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#9355f6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#9355f6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- мягкое свечение (прозрачный фон, без заливки-подложки) -->
