  <!-- орбиты -->
  <ellipse cx="64" cy="64" rx="52" ry="20" fill="none" stroke="#f9064f" stroke-width="3" opacity="0.7" transform="rotate(-26 64 64)"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#9355f6" stroke-width="2" opacity="0.32"/>
  <!-- ядро-сфера -->
  <circle cx="64" cy="64" r="30" fill="url(#cg-core)"/>
  <!-- блик -->
  <ellipse cx="54" cy="52" rx="8.5" ry="6" fill="#ffffff" opacity="0.5" transform="rotate(-28 54 52)"/>
  <!-- спутник -->
